<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sub-3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/sub-3.css">
    <link rel="stylesheet" href="css/footer.css">

  <body>
    <section id="news">
      <div class="title">
        <h2>우리의 행동이 모여<br />새로운 이야기가 됩니다</h2>
      </div>

      <input type="radio" name="page" id="page1" checked />
      <input type="radio" name="page" id="page2" />

      <div class="page page1">
        <div class="news__cards" id="page1Cards"></div>
      </div>

      <div class="page page2">
        <div class="news__cards" id="page2Cards"></div>
      </div>

      <div class="pagination">
        <div class="arrow disabled" id="prevBtn">‹</div>
        <label for="page1">1</label>
        <label for="page2">2</label>
        <div class="arrow" id="nextBtn">›</div>
      </div>
    </section>

    <!-- 푸터 시작 -->
    <footer>
        <div class="out__container">
            <div class="footer__box">
                <div class="footer__etc">
                    <a href="">제휴제안</a>
                    <a href="">기업윤리</a>
                    <a href=""><strong>개인정보 처리방침</strong></a>
                </div>
                <div class="plus__btns">
                <a href="" class="plus__link">
                    <span class="footer__text"><strong>국내법인</strong></span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" class="icon" viewBox="0 0 28 28" fill="none">
                    <circle cx="14" cy="14" r="13.5" fill="#36363D"></circle>
                    <path d="M14 9V19" stroke="white" stroke-width="2"></path>
                    <path d="M19 14L9 14" stroke="white" stroke-width="2"></path>
                    </svg>
                </a>
                <a href="" class="plus__link">
                    <span class="footer__text"><strong>해외법인</strong></span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" class="icon" viewBox="0 0 28 28" fill="none">
                    <circle cx="14" cy="14" r="13.5" fill="#36363D"></circle>
                    <path d="M14 9V19" stroke="white" stroke-width="2"></path>
                    <path d="M19 14L9 14" stroke="white" stroke-width="2"></path>
                    </svg>
                </a>
            </div>
        </div>
        <div class="copy__right">
            <span>Team Simple Is The Best. All rights reserved.</span>
        </div>
    </footer>
    <script src="js/sub-3.js"></script>
